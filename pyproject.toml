[project]
name = "grocy-ultimate-lookup"
version = "0.1.0"
description = "Multi-source barcode lookup service for Grocy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "pytest>=8.0.0",
  "uvicorn[standard]>=0.30.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "plugin*", "scripts*", "tests*"]
