name: CD

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish container image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Normalize GHCR owner
        shell: bash
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/grocy-ultimate-lookup
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Add image details to release
        uses: actions/github-script@v7
        env:
          IMAGE_TAG: ghcr.io/${{ env.GHCR_OWNER }}/grocy-ultimate-lookup:${{ steps.meta.outputs.version }}
        with:
          script: |
            const release = context.payload.release;
            const marker = '<!-- ghcr-image -->';
            const block = `${marker}

            ## Container Image

            \`${process.env.IMAGE_TAG}\`
            `;
            const body = release.body || '';
            const nextBody = body.includes(marker)
              ? body.replace(new RegExp(`${marker}[\\s\\S]*$`), block.trim())
              : `${body}\n\n${block}`.trim();
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: nextBody,
            });
