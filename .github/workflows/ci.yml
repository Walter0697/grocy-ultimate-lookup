name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest -vv 2>&1 | tee pytest-output.log

      - name: Summarize pytest failure
        id: pytest_failure
        if: failure() && steps.pytest.conclusion == 'failure'
        shell: bash
        run: |
          summary="$(grep -E '^(E   |ERROR|FAILED|ImportError|ModuleNotFoundError|PermissionError|AssertionError|.+Error:)' pytest-output.log | head -n 1 || true)"
          summary="${summary:-$(tail -n 1 pytest-output.log)}"
          summary="$(printf '%s' "$summary" | tr -c '[:alnum:] ._=-' '-' | cut -c 1-80)"
          echo "summary=${summary:-pytest-failed}" >> "$GITHUB_OUTPUT"

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ steps.pytest_failure.outputs.summary || 'unknown' }}
          path: pytest-output.log

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t grocy-ultimate-lookup:ci .
