<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantry Signal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/scan-dialog.css">
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <p>SCANNER ACTIVITY</p>
      <h1>Kitchen scans</h1>
    </div>
    <nav class="filters page-tabs">
      <a class="active" href="/">Scan</a>
      <a href="/items">Items</a>
      <a href="/logs">Logs</a>
      <a href="/settings">Settings</a>
    </nav>
    <div class="header-actions">
      <span class="online"><i></i> Grocy online</span>
      <form id="quick-scan" class="quick-scan">
        <input name="barcode" placeholder="Scan barcode + Enter" autocomplete="off" required autofocus>
        <span class="scan-loading" aria-live="polite"><i></i><b>Looking up product...</b></span>
      </form>
    </div>
  </header>

  <main>
    <nav class="filters scan-filters">
      <button class="active" data-filter="all">All <b id="all-count">0</b></button>
      <button data-filter="review">Needs review <b id="review-count">0</b></button>
      <button data-filter="applied">Applied</button>
      <button data-filter="failed">Failed</button>
    </nav>
    <section id="scanner-status" class="scanner-status" aria-live="polite"></section>
    <div id="event-grid" class="event-grid"></div>
  </main>

  <dialog id="scan-dialog" class="scan-dialog">
    <button id="close-scan-dialog" class="close">Close</button>
    <div id="scan-preview-content"></div>
  </dialog>
  <dialog id="product-edit-dialog" class="scan-dialog">
    <button id="close-product-edit-dialog" class="close">Close</button>
    <div id="product-edit-content"></div>
  </dialog>
  <dialog id="review-dialog" class="scan-dialog">
    <button id="close-review-dialog" class="close">Close</button>
    <div id="review-dialog-content"></div>
  </dialog>
  <div id="toast"></div>
  {{APP_VERSION_BADGE}}
  <script src="/static/stock-confirm.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
