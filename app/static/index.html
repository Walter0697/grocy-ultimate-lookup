<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantry Signal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <p>SCANNER ACTIVITY</p>
      <h1>Kitchen scans</h1>
    </div>
    <nav class="filters">
      <button class="active" data-filter="all">All <b id="all-count">0</b></button>
      <button data-filter="review">Needs review <b id="review-count">0</b></button>
      <button data-filter="applied">Applied</button>
      <button data-filter="failed">Failed</button>
    </nav>
    <div class="header-actions">
      <span class="online"><i></i> Grocy online</span>
      <button id="toggle-scanner">Manual scan</button>
    </div>
  </header>

  <section id="manual-scanner" class="manual-scanner hidden">
    <form id="scan-form">
      <label class="barcode-field">Barcode<input name="barcode" placeholder="Scan or enter barcode" required></label>
      <label>Mode<select name="mode"><option value="add">Add</option><option value="remove">Remove</option><option value="set">Set</option></select></label>
      <label>Quantity<input name="quantity" type="number" min="0" step="0.01" value="1" required></label>
      <label>Location<select name="location_id"><option value="">Product default</option></select></label>
      <input name="device_id" type="hidden" value="dashboard-manual">
      <button>Apply scan</button>
    </form>
    <p>Known products apply instantly. Unknown or uncertain products appear as dotted review cards.</p>
  </section>

  <main>
    <div id="event-grid" class="event-grid"></div>
  </main>

  <aside id="review-drawer" class="review-drawer" aria-hidden="true">
    <button id="close-drawer" class="close">Close</button>
    <div id="drawer-content"></div>
  </aside>
  <div id="drawer-backdrop" class="backdrop hidden"></div>
  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
