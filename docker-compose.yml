services:
  lookup:
    build: .
    container_name: grocy-ultimate-lookup
    restart: unless-stopped
    ports:
      - "9290:9290"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9290/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - ./data:/data
      - ~/.codex/auth.json:/secrets/auth.json:ro
