services:
  lookup:
    build: .
    container_name: grocy-ultimate-lookup
    restart: unless-stopped
    ports:
      - "9290:9290"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ~/.codex/auth.json:/secrets/auth.json:ro
